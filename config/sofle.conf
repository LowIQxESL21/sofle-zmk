# Дисплей
CONFIG_ZMK_DISPLAY=y

# Энкодеры (крутилки)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Питание и сон (стандартный официальный глубокий сон ZMK)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_EXT_POWER=y

# Включение ZMK Studio без кнопки блокировки
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
